name: Build Verification Check

on:
  push:
    branches:
      - local
  pull_request:
    branches:
      - local
  workflow_dispatch:

jobs:
  verify-build:
    name: Verify Frontend & Electron Build
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Web Frontend Build (Vite)
        run: npm run build

      - name: Verify Electron TypeScript Compilation
        run: npm run electron:build
